name: Release

# Publishes a GitHub release whenever the version in manifest.json changes.
# HACS reads these releases, so Home Assistant offers the new version under
# Settings -> Updates with these release notes, instead of a "Redownload".

on:
  push:
    branches: [main]
    paths: [custom_components/mittog/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: echo "version=$(jq -r .version custom_components/mittog/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already released"
          else
            gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
